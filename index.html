<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Смена Уфа — Быстрая подработка</title>
        <script src="https://telegram.org"></script>
        <script src="https://jsdelivr.net"></script>
    <style>
        :root {
            --bg-color: #f4f5f7;
            --card-bg: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #6e7781;
            --accent: #10b981;
            --primary: #2563eb;
            --border: #e5e7eb;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 85px; }
        
        /* Шапка */
        .header { background: var(--card-bg); padding: 16px; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--border); }
        .header h1 { font-size: 20px; font-weight: 700; margin-bottom: 12px; }
        
        /* Фильтры по районам */
        .filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
        .filters::-webkit-scrollbar { display: none; }
        .filter-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: #fff; font-size: 13px; font-weight: 500; white-space: nowrap; cursor: pointer; }
        .filter-btn.active { background: var(--text-main); color: #fff; border-color: var(--text-main); }

        /* Лента карточек */
        .container { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .card { background: var(--card-bg); border-radius: 16px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid var(--border); }
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; gap: 8px; }
        .job-title { font-size: 17px; font-weight: 700; }
        .price { font-size: 17px; font-weight: 800; color: var(--accent); background: #ecfdf5; padding: 4px 10px; border-radius: 10px; white-space: nowrap; }
        .info-row { font-size: 14px; color: var(--text-muted); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
        .badge { display: inline-block; font-size: 12px; color: var(--primary); background: #eff6ff; padding: 4px 8px; border-radius: 6px; font-weight: 600; margin-top: 4px; margin-bottom: 12px; }
        
        .btn-apply { width: 100%; padding: 12px; border: none; border-radius: 12px; background: var(--primary); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-apply:active { transform: scale(0.98); }
        .btn-apply.applied { background: var(--accent); }
        .btn-apply:disabled { opacity: 0.6; }

        /* Форма добавления смены */
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: var(--text-muted); }
        .form-group input, .form-group select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); font-size: 15px; background: #fff; }

        /* Нижняя навигация */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0; z-index: 20; }
        .nav-item { border: none; background: none; font-size: 12px; font-weight: 600; color: var(--text-muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-item.active { color: var(--primary); }
        .hidden { display: none; }
        .loader { text-align: center; color: var(--text-muted); padding: 30px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>⚡ Смена Уфа</h1>
        <div class="filters" id="filterBar">
            <button class="filter-btn active"
onclick="filterShifts('Все', this)">Все районы</button>
            <button class="filter-btn" onclick="filterShifts('Затон', this)">Затон</button>
            <button class="filter-btn" onclick="filterShifts('Центр', this)">Центр</button>
            <button class="filter-btn" onclick="filterShifts('Проспект', this)">Проспект Октября</button>
            <button class="filter-btn" onclick="filterShifts('Сипайлово', this)">Сипайлово</button>
            <button class="filter-btn" onclick="filterShifts('Зеленая Роща', this)">Зеленая Роща</button>
            <button class="filter-btn" onclick="filterShifts('Черниковка', this)">Черниковка</button>
            <button class="filter-btn" onclick="filterShifts('Дёма', this)">Дёма</button>
            <button class="filter-btn" onclick="filterShifts('Инорс', this)">Инорс</button>
        </div>
    </div>

    <!-- Вкладка 1: Лента смен -->
    <div id="tab-feed" class="container">
        <div class="loader">Загрузка актуальных смен...</div>
    </div>

    <!-- Вкладка 2: Разместить смену (для работодателя) -->
    <div id="tab-add" class="container hidden">
        <div class="card">
            <h2 style="margin-bottom: 12px; font-size: 18px;">Новая смена</h2>
            <div class="form-group">
                <label>Кого ищем?</label>
                <input type="text" id="inp-title" placeholder="Например: Бариста на замену">
            </div>
            <div class="form-group">
                <label>Оплата за смену (₽)</label>
                <input type="number" id="inp-price" placeholder="2500">
            </div>
            <div class="form-group">
                <label>Район Уфы</label>
                <select id="inp-district">
                    <option value="Затон">Затон</option>
                    <option value="Центр">Центр</option>
                    <option value="Проспект">Проспект Октября</option>
                    <option value="Сипайлово">Сипайлово</option>
                    <option value="Зеленая Роща">Зеленая Роща</option>
                    <option value="Черниковка">Черниковка</option>
                    <option value="Дёма">Дёма</option>
                    <option value="Инорс">Инорс</option>
                </select>
            </div>
            <div class="form-group">
                <label>Точный адрес и контакт для связи</label>
                <input type="text" id="inp-address" placeholder="ул. Ахметова, 300 (тел. +7 999...)">
            </div>
            <div class="form-group">
                <label>Дата и время</label>
                <input type="text" id="inp-time" placeholder="Завтра, 09:00 – 18:00">
            </div>
            <button class="btn-apply" id="btn-submit" onclick="addNewShift()">Опубликовать смену</button>
        </div>
    </div>

    <!-- Нижнее меню -->
    <div class="bottom-nav">
        <button class="nav-item active" id="nav-feed" onclick="switchTab('feed', this)">
            <span>🔍 Смены</span>
        </button>
        <button class="nav-item" id="nav-add" onclick="switchTab('add', this)">
            <span>➕ Разместить</span>
        </button>
    </div>

      <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) tg.expand();

        const SUPABASE_URL = 'https://supabase.co';
        const SUPABASE_KEY = 'sb_publishable_zP_CsdyApV2Cotw_BVl3lQ_-EBTfX1Y';
        
        let db = null;
        if (window.supabase) {
            db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }

        let shifts = [];
        let appliedIds = JSON.parse(localStorage.getItem('appliedShifts') || '[]');
        let currentFilter = 'Все';

        async function loadShifts() {
            const feed = document.getElementById('tab-feed');
            if (!db) {
                feed.innerHTML = '<div class="loader">Ошибка: библиотека базы данных не загрузилась. Проверьте 7-ю строку кода.</div>';
                return;
            }

            try {
                const { data, error } = await db
                    .from('shifts')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) {
                    feed.innerHTML = '<div class="loader">Ошибка базы: ' + error.message + '</div>';
                    return;
                }

                shifts = data || [];
                renderShifts();
            } catch (e) {
                feed.innerHTML = '<div class="loader">Сбой сети: ' + e.message + '</div>';
            }
        }

        function renderShifts() {
            const feed = document.getElementById('tab-feed');
            feed.innerHTML = '';
            const filtered = currentFilter === 'Все' ? shifts : shifts.filter(s => s.district === currentFilter);

            if (filtered.length === 0) {
                feed.innerHTML = '<div class="loader">В этом районе пока нет открытых смен.<br>Нажмите «➕ Разместить», чтобы добавить первую!</div>';
                return;
            }

            filtered.forEach(shift => {
                const isApplied = appliedIds.includes(shift.id);
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-top">
                        <div class="job-title">${shift.title}</div>
                        <div class="price">${shift.price}</div>
                    </div>
                    <div class="info-row">🕒 ${shift.time}</div>
                    <div class="info-row">📍 ${shift.district}, ${shift.address}</div>
                    <div class="badge">✔ Проверенный заказчик • Оплата сразу</div>
                    <button class="btn-apply ${isApplied ? 'applied' : ''}" onclick="applyShift(${shift.id})">
                        ${isApplied ? '✅ Вы откликнулись! Свяжитесь по контакту выше' : 'Откликнуться в 1 клик'}
                    </button>
                `;
                feed.appendChild(card);
            });
        }

        function filterShifts(district, btn) {
            currentFilter = district;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderShifts();
        }

        function applyShift(id) {
            if (!appliedIds.includes(id)) {
                appliedIds.push(id);
                localStorage.setItem('appliedShifts', JSON.stringify(appliedIds));
                renderShifts();
                if (tg && tg.showAlert) {
                    tg.showAlert('Вы откликнулись на смену! Контакты для связи указаны в адресе карточки.');
                } else {
                    alert('Вы откликнулись на смену!');
                }
            }
        }

        async function addNewShift() {
            if (!db) {
                alert('База данных не подключена! Проверьте 7-ю строку index.html на GitHub.');
                return;
            }

            const title = document.getElementById('inp-title').value.trim();
            const price = document.getElementById('inp-price').value.trim();
            const district = document.getElementById('inp-district').value;
            const address = document.getElementById('inp-address').value.trim();
            const time = document.getElementById('inp-time').value.trim();
            const btn = document.getElementById('btn-submit');

            if (!title || !price || !address || !time) {
                alert('Заполните все поля!');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Публикация...';

            try {
                const { error } = await db
                    .from('shifts')
                    .insert([{
                        title: title,
                        price: price + ' ₽',
                        district: district,
                        address: address,
                        time: time
                    }]);

                if (error) {
                    alert('Ошибка Supabase: ' + error.message);
                } else {
                    document.getElementById('inp-title').value = '';
                    document.getElementById('inp-price').value = '';
                    document.getElementById('inp-address').value = '';
                    document.getElementById('inp-time').value = '';
                    switchTab('feed', document.getElementById('nav-feed'));
                    await loadShifts();
                }
            } catch (e) {
                alert('Ошибка отправки: ' + e.message);
            } finally {
                btn.disabled = false;
                btn.innerText = 'Опубликовать смену';
            }
        }

        function switchTab(tab, btn) {
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (tab === 'feed') {
                document.getElementById('tab-feed').classList.remove('hidden');
                document.getElementById('tab-add').classList.add('hidden');
            } else {
                document.getElementById('tab-feed').classList.add('hidden');
                document.getElementById('tab-add').classList.remove('hidden');
            }
        }

        loadShifts();
    </script>
</body>
</html>
